name: Release

# Push a tag like v0.1.0 (matching __version__ in resindeck.py) to build the desktop
# packages and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  linux:
    needs: ci
    runs-on: ubuntu-22.04  # older glibc, so the AppImage runs on more distros
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("resindeck.py").read())[1])')
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: pip install -r requirements-desktop.txt
      - run: sh packaging/build_appimage.sh python
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.AppImage

  windows:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-desktop.txt
      - run: python -m PyInstaller --noconfirm --distpath build/dist --workpath build/work packaging/resindeck.spec
      - name: Name the executable after the version
        shell: bash
        run: |
          version=$(python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("resindeck.py").read())[1])')
          mkdir -p dist
          mv build/dist/ResinDeck.exe "dist/ResinDeck-${version}-windows-x64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "ResinDeck $GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
          fi
