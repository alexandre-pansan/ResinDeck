name: CI

# Lint, build with warnings as errors and run the tests (Linux with sanitizers, Windows), then build
# the desktop packages and start each one. Runs on pull requests and on main; the release workflow
# runs it and publishes the packages it builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Qt 6.10: aqtinstall cannot read the Windows packages of Qt 6.11 yet (they moved to one folder per build).
env:
  QT_VERSION: "6.10.3"
  QT_MODULES: qtwebsockets qthttpserver qtshadertools

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript syntax (web interface)
        run: for f in static/*.js; do node --check "$f"; done
      - name: Shell syntax
        run: for f in build.sh packaging/*.sh; do sh -n "$f"; done

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitize: "ON"
          - os: windows-latest
            sanitize: "OFF"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # the desktop smoke test has no screen
      QT_FORCE_STDERR_LOGGING: "1"  # on Windows, Qt's messages and failed assertions go to the log
    steps:
      - uses: actions/checkout@v7
      - name: OpenGL headers (Qt Gui needs them)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libegl-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true
      - name: Configure
        run: >
          cmake -B build/cpp -DCMAKE_BUILD_TYPE=Debug
          -DRESINDECK_WERROR=ON -DRESINDECK_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build/cpp --config Debug --parallel
      - name: Test
        run: ctest --test-dir build/cpp -C Debug --output-on-failure
      - name: Failed tests again, with all their output
        if: failure()
        run: ctest --test-dir build/cpp -C Debug --rerun-failed -V

  # The packages, started once to check they work. The release workflow publishes these artifacts.
  packages:
    name: packages (${{ matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]  # 22.04: older glibc, so the AppImage runs on more distros
    env:
      RESINDECK_LAN: "0"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Build tools and OpenGL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev libegl-dev libxkbcommon-x11-0 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: QT_DIR="$QT_ROOT_DIR" sh packaging/build_appimage.sh
      - name: Smoke test the AppImage
        if: runner.os == 'Linux'
        run: |
          app=$(ls dist/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$app" --port 18766 > app.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:18766/api/session && break; sleep 1; done
          curl -sf http://127.0.0.1:18766/ | grep -q ResinDeck
          curl -sf http://127.0.0.1:18766/static/vendor/three/three.module.js > /dev/null
          curl -sf -X POST http://127.0.0.1:18766/api/quit
          wait || true
          cat app.log

      - name: Build the Windows packages
        if: runner.os == 'Windows'
        shell: bash
        run: QT_DIR="$QT_ROOT_DIR" sh packaging/build_windows.sh
      - name: Smoke test the Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process build/windows/ResinDeck/resindeck.exe -ArgumentList "--port", "18766" -PassThru
          $url = "http://127.0.0.1:18766"
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest "$url/api/session" -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 }
          }
          $page = Invoke-WebRequest "$url/" -UseBasicParsing
          if ($page.Content -notmatch "ResinDeck") { throw "unexpected page" }
          Invoke-WebRequest "$url/api/quit" -Method Post -UseBasicParsing | Out-Null
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "ResinDeck did not quit" }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os == 'Linux' && 'linux' || 'windows' }}
          path: dist/*
