# Weekly pull requests for outdated Python dependencies and GitHub Actions.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # The requirements files give minimum versions, and pip installs the newest anyway.
    # Only raise a minimum when a new release falls outside it: raising them all
    # would drop support for older Python versions and distros for no gain.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
